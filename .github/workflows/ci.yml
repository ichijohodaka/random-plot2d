name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # node があるので、焼き込んだ script が読めるかの試験も飛ばされずに走る
      - name: go test
        run: go test -race ./...

      - name: node test
        run: node --test test/

      - name: 1枚の HTML を作れる
        run: go run ./cmd/rp2page -o /tmp/rp2.html
